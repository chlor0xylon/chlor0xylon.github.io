name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node stays installed because a Bun/JavaScriptCore bug breaks OG image
      # generation (ultrahtml/satori-html). Bun delegates script execution to
      # Node via the shebang in node_modules/.bin, as long as Node is in PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - run: bun run build
