[build]
  command = 'bun run build'

[build.environment]
  # .nvmrc still pins the Node version Netlify provisions. Node stays
  # installed because a Bun/JavaScriptCore bug breaks OG image generation
  # (ultrahtml/satori-html); Bun delegates script execution to Node via the
  # shebang in node_modules/.bin, as long as Node is in PATH.
  BUN_VERSION = "1.4.4"